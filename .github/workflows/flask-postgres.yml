name: CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'requirements.txt'
      - 'dockerfile'
      - 'docker-compose.yml'
      - 'templates/**'
      - '.github/workflows/flask-postgres.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app.py'
      - 'requirements.txt'
      - 'dockerfile'
      - 'docker-compose.yml'
      - 'templates/**'
      - '.github/workflows/flask-postgres.yml'

env:
  AWS_REGION: us-east-2                 # change to your AWS region
  ECR_REPOSITORY: gha-test-repo-app    # change to your ECR repo name
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t docker-practice-app:test .

      - name: Start app + db via Compose
        run: docker compose up -d --build

      - name: Wait for /health to pass
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:5000/health; then
              echo "App is healthy"
              exit 0
            fi
            echo "Waiting for app... ($i/15)"
            sleep 3
          done
          echo "App failed health check"
          docker compose logs
          exit 1

      - name: Tear down
        if: always()
        run: docker compose down -v

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition gha-test-repo-task \
            --query taskDefinition \
            --region $AWS_REGION > task-definition.json

      - name: Render new task definition with the new image
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: flask-app
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy new task definition revision to ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: gha-test-repo-service
          cluster: gha-test-repo-cluster
          wait-for-service-stability: true
