<!doctype html>
<html>
<head>
  <title>Login - Docker Flask-Postgres-Practice App</title>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 380px;
      margin: 100px auto;
      padding: 0 20px;
      background: #f4f6fb;
      color: #1f2333;
    }

    .card {
      background: #ffffff;
      border-radius: 14px;
      padding: 32px;
      box-shadow: 0 10px 30px rgba(31, 35, 51, 0.08);
    }

    h2 {
      margin: 0 0 4px;
      font-size: 22px;
      color: #2d2f6b;
    }

    .subtitle {
      margin: 0 0 24px;
      font-size: 13px;
      color: #8a8fb3;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input {
      padding: 10px 12px;
      border: 1px solid #dfe2f0;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s ease;
    }

    input:focus {
      border-color: #6366f1;
    }

    button {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      background: #6366f1;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    button:hover {
      background: #4f46e5;
    }

    .error {
      background: #fef2f2;
      color: #b91c1c;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Sign in</h2>
    <p class="subtitle">Flask + Postgres, containerized</p>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
      <div class="error">{{ messages[0] }}</div>
      {% endif %}
    {% endwith %}

    <form method="post">
      <input name="username" placeholder="Username" required autofocus>
      <input name="password" type="password" placeholder="Password" required>
      <button type="submit">Log in</button>
    </form>
  </div>
</body>
</html>
