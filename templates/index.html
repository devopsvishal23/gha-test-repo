<!doctype html>
<html>
<head>
  <title>Docker Flask-Postgres-Practice App</title>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 640px;
      margin: 60px auto;
      padding: 0 20px;
      background: #f4f6fb;
      color: #1f2333;
    }

    .card {
      background: #ffffff;
      border-radius: 14px;
      padding: 32px;
      box-shadow: 0 10px 30px rgba(31, 35, 51, 0.08);
    }

    h2 {
      margin: 0 0 4px;
      font-size: 22px;
      color: #2d2f6b;
    }

    .subtitle {
      margin: 0 0 24px;
      font-size: 13px;
      color: #8a8fb3;
    }

    form {
      display: flex;
      gap: 10px;
      margin-bottom: 28px;
    }

    input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #dfe2f0;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s ease;
    }

    input:focus {
      border-color: #6366f1;
    }

    button {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      background: #6366f1;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    button:hover {
      background: #4f46e5;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      text-align: left;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #9296b8;
      padding: 8px 10px;
      border-bottom: 2px solid #eef0f8;
    }

    td {
      padding: 12px 10px;
      font-size: 14px;
      border-bottom: 1px solid #f1f2f9;
    }

    tr:hover td {
      background: #f8f9ff;
    }

    .empty {
      text-align: center;
      color: #b0b3ce;
      padding: 24px 0;
      font-size: 14px;
    }

    .del {
      color: #ef4444;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
    }

    .del:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Records</h2>
    <p class="subtitle">Flask + Postgres, containerized</p>

    <form action="/add" method="post">
      <input name="name" placeholder="Name" required>
      <input name="email" placeholder="Email" required>
      <button type="submit">Add</button>
    </form>

    <table>
      <tr><th>ID</th><th>Name</th><th>Email</th><th></th></tr>
      {% for r in records %}
      <tr>
        <td>{{ r[0] }}</td>
        <td>{{ r[1] }}</td>
        <td>{{ r[2] }}</td>
        <td><a class="del" href="/delete/{{ r[0] }}">Delete</a></td>
      </tr>
      {% endfor %}
    </table>
    {% if not records %}
    <div class="empty">No records yet - add one above.</div>
    {% endif %}
  </div>
</body>
</html>
